# Core terminal behavior
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"
set -g focus-events on
set -g extended-keys on
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
set -s escape-time 10

# Clipboard and scrollback
set -s set-clipboard external
set -g history-limit 200000

# Input model
set -g prefix C-Space
set -g prefix2 C-b
bind C-Space send-prefix
setw -g mode-keys vi
set -g status-keys vi
set -g mouse on

# Window and pane numbering
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g automatic-rename on
setw -g allow-rename off
set -g pane-border-format " #{pane_index} #{pane_current_command} "
set -g pane-border-status top

# New windows and splits should inherit the current working directory
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind Tab display-popup -E -w 85% -h 85% -d "#{pane_current_path}" yazi

# Vim-like pane movement and resizing
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Copy mode
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-and-cancel

# Fast reload
unbind r
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# Status line
set -g status-position bottom
set -g status-justify left
set -g status-interval 5
set -g display-time 3000
set -g status-left-length 40
set -g status-right-length 160
set -g window-status-separator ""

# Catppuccin-inspired colors without plugin dependencies
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g message-style "bg=#313244,fg=#cdd6f4"
set -g message-command-style "bg=#313244,fg=#cdd6f4"
set -g mode-style "bg=#f9e2af,fg=#1e1e2e"
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#89b4fa"
setw -g window-status-style "fg=#bac2de,bg=#1e1e2e"
setw -g window-status-current-style "fg=#1e1e2e,bg=#cba6f7,bold"
setw -g window-status-activity-style "fg=#1e1e2e,bg=#fab387,bold"
setw -g window-status-bell-style "fg=#1e1e2e,bg=#f38ba8,bold"

set -g status-left "#[fg=#1e1e2e,bg=#89b4fa,bold] #S #[default]"
set -g window-status-format " #[fg=#bac2de]#I:#W "
set -g window-status-current-format " #[fg=#1e1e2e,bg=#cba6f7,bold]#I:#W "
set -g status-right "#[fg=#a6e3a1]#h #[fg=#6c7086]| #[fg=#94e2d5]#{b:pane_current_path} #[fg=#6c7086]| #[fg=#fab387]#(git -C '#{pane_current_path}' branch --show-current 2>/dev/null) #[fg=#6c7086]| #[fg=#f9e2af]#{pane_current_command} #[fg=#6c7086]| #[fg=#89b4fa]%Y-%m-%d %H:%M "
